name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Principe du moindre privilege : aucun job de ce workflow n'ecrit dans le
# depot. Toute elevation doit etre declaree explicitement, job par job.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Le plugin declare « Requires PHP: 8.0 » : il doit au minimum s'analyser
  # syntaxiquement sur toute la plage annoncee, sinon l'en-tete ment et une
  # installation sur PHP 8.0 casse en fatale a l'activation.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.1", "8.2", "8.3", "8.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint syntaxique
        run: php -l g2rd-suivi-contact.php

  # ---------------------------------------------------------------------------
  # Standards de code, compatibilite PHP et analyse statique.
  # Ces etapes sont BLOQUANTES : contrairement au workflow du theme, aucune
  # n'utilise continue-on-error. Le plugin part propre, il doit le rester.
  # ---------------------------------------------------------------------------
  standards:
    name: Standards & analyse statique
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          ini-values: memory_limit=1G
          coverage: none
          tools: composer, cs2pr

      - name: Valider composer.json
        run: composer validate --strict --no-check-publish

      - name: Installer les dependances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verifier les standards PHPCS disponibles
        run: vendor/bin/phpcs -i

      - name: PHPCS — WordPress Coding Standards
        run: vendor/bin/phpcs --standard=phpcs.xml.dist --report-full --report-checkstyle=./phpcs-report.xml
        continue-on-error: false

      - name: Annotations PHPCS
        if: failure()
        run: cs2pr ./phpcs-report.xml

      - name: PHPCompatibility — PHP 8.0 et superieur
        run: composer run phpcs:compat

      - name: PHPStan — niveau max
        run: composer run phpstan

      - name: Rapports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phpcs-report
          path: phpcs-report.xml
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Plugin Check : l'outil officiel WordPress.org. Restreint aux categories
  # « security » et « performance » — les categories plugin_repo/general
  # verifient la conformite au repertoire officiel (readme.txt, captures,
  # etiquettes), ou ce plugin n'est pas destine a etre publie.
  # ---------------------------------------------------------------------------
  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plugin Check
        uses: wordpress/plugin-check-action@98a1788320d0add90df2d8183934ecccbc4e05d2 # v1.1.7
        with:
          categories: |
            security
            performance
          exclude-directories: |
            vendor
            .github
